<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="View statistics for YCombinator's Hacker News website, including the most-commented articles, the users who post the most comments, and more.">
    <meta name="keywords" content="hacker news,ycombinator,statistics,articles,comments">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts and project stylesheet -->
    <link href="https://fonts.googleapis.com/css?family=Cutive+Mono|Lekton|Rajdhani" rel="stylesheet">

    <!-- Google Analytics script to track page views -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-91236421-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'UA-91236421-1');
    </script>

    <title>Hacker News Statsboard</title>
  </head>
  <body>
    <!-- Page title link -->
    <h1 id="title"><a href=".">Hacker News Statsboard</a></h1>

    <!-- Main dashboard table (layout only) -->
    <main id="main">
    <table id="main-table" role="presentation" border="0" cellpadding="0" cellspacing="0">
      <tbody>
        <!-- Spacer row -->
        <tr id="top-spacer"></tr>

        <!-- Table header -->
        <tr id="header-row">

          <td id="header-cell">

            <!-- Toggle stats buttons -->
            <div id="buttons" role="group" aria-label="Time period">
              <button id="hour" type="button" class="period" aria-pressed="false">past hour</button>
              <button id="day" type="button" class="period selected" aria-pressed="true">past day</button>
              <button id="week" type="button" class="period" aria-pressed="false">past week</button>
              <button id="all" type="button" class="period" aria-pressed="false">all time</button>
            </div>
            <p id="period-note">From hourly snapshots of the Hacker News front page.</p>
            <p id="last-scrape"></p>

          </td>

          <!-- Colorful divider tables -->
          <td id="header-bottom-spacer">

            <table role="presentation" width="100%" cellspacing="0" cellpadding="1">
              <tbody>
                <tr>
                  <td id="divider-one"></td>
                </tr>
              </tbody>
            </table>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="1">
              <tbody>
                <tr>
                  <td id="divider-two"></td>
                </tr>
              </tbody>
            </table>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="1">
              <tbody>
                <tr>
                  <td id="divider-three"></td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>

        <!-- Extra margin for top of table -->
        <tr id="table-top-margin"></tr>

        <!-- Stats container row -->
        <tr id="inner-table-row">
          <td>
            <table id="inner-table" role="presentation" border="0" cellpadding="0" cellspacing="0">
              <tbody>
                <tr class="stat-row">

                  <!-- Counts of each post type -->
                  <td class="stat-cell">
                    <div id="post-types" class="chart-container"></div>
                  </td>

                  <!-- Bar chart of posts with highest comment counts -->
                  <td class="stat-cell">
                    <div id="comment-count-bar" class="chart-container"></div>
                  </td>

                  <!-- Bubble chart of users with highest comment counts -->
                  <td class="stat-cell">
                    <div id="user-comment-bubble" class="chart-container"></div>
                  </td>

                  <!-- Word cloud of highest frequency words in comments -->
                  <td class="stat-cell">
                    <div id="comment-word-cloud" class="chart-container"></div>
                  </td>

                </tr>

                <!-- Extra space at bottom of table before divider -->
                <tr id="bottom-spacer"></tr>

              </tbody>
            </table>
          </td>
        </tr>

        <tr>
          <td>

            <!-- Colorful bottom table divider -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="1">
              <tbody>
                <tr>
                  <td id="divider-four"></td>
                </tr>
              </tbody>
            </table>

          </td>
        </tr>

      </tbody>
    </table>
    </main>

    <!-- Crystal Prism footer (fleet kit, rendered by main.js) -->
    <div id="footer"></div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
